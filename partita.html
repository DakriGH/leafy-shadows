<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Leafy-Shadows · la partita (nucleo)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd0e8; touch-action: none; }
  #tela { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #fps { position: fixed; right: 8px; top: 8px; z-index: 10; font: 600 13px/1.4 ui-monospace, monospace; color: #0d2a1a;
         background: rgba(255,255,255,.72); padding: 5px 9px; border-radius: 6px; pointer-events: none; text-align: right; white-space: pre; }
  #stato { position: fixed; left: 8px; top: 8px; z-index: 10; font: 11px/1.45 ui-monospace, monospace; color: #0d2a1a;
           background: rgba(255,255,255,.72); padding: 6px 9px; border-radius: 6px; white-space: pre-wrap; pointer-events: none; max-width: 62vw; }
  #stato[hidden] { display: none; }
  #fps { font-size: 11px; padding: 3px 7px; opacity: .8; }
  /* l'Officina: una colonna scura a destra della tela, fuori dal gioco */
  body.con-officina { display: flex; flex-direction: row; }
  body.con-officina #tela { width: calc(100% - 400px); }
  #dock { display: none; }
  body.con-officina #dock { display: block; width: 400px; height: 100%; background: #151c18; color: #dfe8e2; overflow: auto; position: relative; }
  #chiudiDock { position: absolute; right: 8px; top: 6px; z-index: 50; background: transparent; color: #dfe8e2; border: 1px solid rgba(223,232,226,.3); border-radius: 6px; font: 12px ui-monospace, monospace; padding: 2px 8px; }
  /* ⚠ NIENTE INTERFACCIA DEL GIOCO SOPRA L'OFFICINA: a lato si spostano gli elementi fissi di destra, a foglio si nascondono */
  body.con-officina #fps, body.con-officina #azioni, body.con-officina #versione { right: 408px; }
  body.con-officina #comandi .btn { right: 418px; }
  body.con-officina #diagPanel { right: 408px; }
  body.con-officina #barra { left: calc((100vw - 400px) / 2); max-width: calc(100vw - 420px); }
  body.con-officina #mira { left: calc((100vw - 400px) / 2); }
  body.con-officina .off-tasto { display: none; }
  #mira { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; z-index: 10; pointer-events: none;
          border: 2px solid rgba(255,255,255,.9); border-radius: 50%; box-shadow: 0 0 0 1px rgba(13,42,26,.5); display: none; }
  body.mira-centro #mira { display: block; }
  #azione { position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%); z-index: 11; pointer-events: none; font: 600 12px/1.2 ui-monospace, monospace;
            color: #fff; background: rgba(13,42,26,.55); padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
  #azione:empty { display: none; }
  /* su uno schermo stretto l'Officina è un foglio dal basso, la tela resta intera */
  @media (max-width: 900px) {
    body.con-officina { display: block; }
    body.con-officina #tela { width: 100%; }
    body.con-officina #dock { position: fixed; left: 0; right: 0; bottom: 0; width: auto; height: 58vh; z-index: 30; border-top: 1px solid rgba(223,232,226,.2); }
    body.con-officina #fps, body.con-officina #azioni { right: 8px; }
    body.con-officina #barra, body.con-officina #mira, body.con-officina #azione { left: 50%; max-width: 96vw; }
    body.con-officina #barra, body.con-officina #azione, body.con-officina #comandi, body.con-officina #modoGui, body.con-officina #diag,
    body.con-officina #fps, body.con-officina #azioni, body.con-officina #versione, body.con-officina #mira { display: none !important; }
  }
  #barra { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 12; display: flex; gap: 4px; max-width: 96vw;
           overflow-x: auto; padding: 4px; background: rgba(255,255,255,.55); border-radius: 8px; scrollbar-width: none; }
  #barra button { flex: 0 0 auto; min-width: 46px; height: 44px; border-radius: 6px; border: 1px solid rgba(13,42,26,.18);
                  background: rgba(255,255,255,.85); font: 600 11px/1.1 ui-monospace, monospace; color: #0d2a1a; padding: 2px 6px; }
  #barra button.scelto { background: #0d2a1a; color: #fff; }
  #barra button .q { display: block; width: 26px; height: 12px; margin: 0 auto 3px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); }
  /* ⚠ LE PILLOLE «col mouse» e «diagnosi» NON STANNO SUL JOYSTICK: a metà
     schermo (46 %) su un telefono di traverso coprivano la parte alta della
     levetta, e spingendo «avanti» il dito partiva sulla pillola: il gatto non
     camminava («il movimento si blocca in avanti»). A dito vanno in alto a sinistra. */
  html.gui-tocco #diag { top: 58px; }
  html.gui-tocco #modoGui { top: 8px; }
  #azioni { position: fixed; right: 8px; top: 64px; z-index: 12; display: flex; flex-direction: column; gap: 6px; }
  #azioni button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(13,42,26,.18); background: rgba(255,255,255,.8);
                   font-size: 20px; color: #0d2a1a; padding: 0; }
  #azioni button.acceso { background: #0d2a1a; color: #fff; }
  #guasto { position: fixed; inset: 12px; z-index: 100; display: none; font: 13px/1.55 ui-monospace, monospace; color: #fff;
            background: #8b1d1d; padding: 14px; border-radius: 8px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
  <canvas id="tela"></canvas>
  <div id="stato" hidden>avvio…</div>
  <div id="fps">—</div>
  <div id="mira"></div>
  <div id="azione"></div>
  <div id="azioni">
    <button id="volo" title="Vola (F)">🪶</button>
    <button id="terza" title="Terza persona (V)">🎥</button>
    <button id="cubi" title="Lancia venti cubi (C)">🎲</button>
    <button id="apriOfficina" title="Officina (apre e chiude)">🛠</button>
  </div>
  <div id="barra"></div>
  <div id="dock"><button id="chiudiDock" title="Chiudi l'Officina">✕</button></div>
  <pre id="guasto"></pre>
  <script type="module">
    const guasto = (e) => {
      const p = document.getElementById('guasto');
      p.style.display = 'block';
      p.textContent += (e && e.stack ? e.stack : String(e)) + '\n';
    };
    window.addEventListener('error', (ev) => guasto(ev.error || ev.message));
    window.addEventListener('unhandledrejection', (ev) => guasto(ev.reason));
    import('./partita.js?v=50d19b5.0246f19d').catch(guasto);
  </script>
  <div id="versione" style="position:fixed;right:8px;bottom:26px;z-index:10;font:11px ui-monospace,monospace;color:rgba(13,42,26,.55);pointer-events:none">04/09, 02:02 · 50d19b5</div>
  <script>(function(){try{fetch('./versione.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(v){v=v.trim();if(v&&v!=='50d19b5.0246f19d'&&sessionStorage.getItem('leafy-ricaricata')!==v){sessionStorage.setItem('leafy-ricaricata',v);location.reload()}}).catch(function(){})}catch(e){}})()</script>
</body>
</html>
