<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Leafy-Shadows · la partita (nucleo)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd0e8; touch-action: none; }
  #tela { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #fps { position: fixed; right: 8px; top: 8px; z-index: 10; font: 600 13px/1.4 ui-monospace, monospace; color: #0d2a1a;
         background: rgba(255,255,255,.72); padding: 5px 9px; border-radius: 6px; pointer-events: none; text-align: right; white-space: pre; }
  #stato { position: fixed; left: 8px; top: 8px; z-index: 10; font: 11px/1.45 ui-monospace, monospace; color: #0d2a1a;
           background: rgba(255,255,255,.72); padding: 6px 9px; border-radius: 6px; white-space: pre-wrap; pointer-events: none; max-width: 62vw; }
  #stato[hidden] { display: none; }
  #fps { font-size: 11px; padding: 3px 7px; opacity: .8; }
  /* ── L'OFFICINA: LA SHELL DELL'EDITOR ──────────────────────────────────────
     ⚠ DUE COLONNE, NON UNA, ed è una richiesta esplicita del committente:
     «voglio comunque una GUI dell'officina come Unity, quindi sinistra e destra
     inspector tutto completo con assets». La colonna sola con dieci schede non
     era un editor ma un CASSETTO: per guardare un oggetto mentre si sfogliano
     gli assets servivano due schede aperte insieme, che è precisamente quello
     che una scheda non sa fare.
     A sinistra la GERARCHIA sopra e gli ASSETS sotto; a destra l'ISPETTORE
     sopra e le IMPOSTAZIONI (le manopole di sempre) sotto; in mezzo il gioco,
     che resta la cosa più grande dello schermo — perché è quello che si guarda. */
  :root { --dock-sx: 268px; --dock-dx: 330px; }
  /* ⚠ LA RIGA VA DICHIARATA. Senza `grid-template-rows`, la griglia si fa una
     riga ALTA QUANTO IL CONTENUTO e il `height: 100%` della tela si misura su
     quella: il gioco finiva in una striscia in cima con mezzo schermo azzurro
     sotto. Non è un difetto che si legge nel CSS — si vede e basta. */
  body.con-officina { display: grid; height: 100%; grid-template-columns: var(--dock-sx) 1fr var(--dock-dx); grid-template-rows: minmax(0, 1fr); }
  body.con-officina #tela { width: 100%; height: 100%; grid-column: 2; grid-row: 1; min-width: 0; }
  #dockSx, #dockDx { display: none; }
  body.con-officina #dockSx, body.con-officina #dockDx {
    display: grid; height: 100%; min-height: 0; background: #151c18; color: #dfe8e2; position: relative;
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  /* ⚠ A SINISTRA GLI ASSETS VOGLIONO PIÙ SPAZIO della gerarchia: la gerarchia è
     un elenco corto (due o tre tipi) finché non si apre un gruppo, la creativa
     è una griglia di quaranta icone che senza spazio mostra due righe e mezza. */
  body.con-officina #dockSx { grid-template-rows: minmax(0, 0.85fr) minmax(0, 1.15fr); }
  body.con-officina #dockSx { grid-column: 1; grid-row: 1; border-right: 1px solid rgba(223,232,226,.14); }
  body.con-officina #dockDx { grid-column: 3; grid-row: 1; border-left: 1px solid rgba(223,232,226,.14); }
  /* ogni riquadro scorre per conto suo: se no il pannello lungo trascina l'altro */
  .riquadro { min-height: 0; overflow: auto; }
  #dockSx .riquadro + .riquadro, #dockDx .riquadro + .riquadro { border-top: 1px solid rgba(223,232,226,.14); }
  #chiudiDock { position: absolute; right: 6px; top: 5px; z-index: 50; background: transparent; color: #dfe8e2; border: 1px solid rgba(223,232,226,.3); border-radius: 6px; font: 12px ui-monospace, monospace; padding: 1px 7px; }
  /* ⚠ NIENTE INTERFACCIA DEL GIOCO SOPRA L'OFFICINA: a lato si spostano gli elementi fissi di destra, a foglio si nascondono */
  body.con-officina #fps, body.con-officina #azioni, body.con-officina #versione { right: calc(var(--dock-dx) + 8px); }
  body.con-officina #comandi .btn { right: calc(var(--dock-dx) + 18px); }
  body.con-officina #diagPanel { right: calc(var(--dock-dx) + 8px); }
  /* ⚠ E ANCHE LE PILLOLE DI SINISTRA vanno spostate. Sono `position: fixed;
     left: 8px`, quindi con l'editor aperto finivano SOPRA il riquadro degli
     Assets — due bottoni del gioco appiccicati addosso a un pannello
     dell'editor. Gli elementi fissi di destra erano già stati spostati; questi
     due erano rimasti indietro perché a destra non si guarda mai a sinistra. */
  body.con-officina #diag, body.con-officina #modoGui { left: calc(var(--dock-sx) + 8px); }
  body.con-officina #barra { left: calc(var(--dock-sx) + (100vw - var(--dock-sx) - var(--dock-dx)) / 2); max-width: calc(100vw - var(--dock-sx) - var(--dock-dx) - 20px); }
  body.con-officina #mira { left: calc(var(--dock-sx) + (100vw - var(--dock-sx) - var(--dock-dx)) / 2); }
  body.con-officina #azione { left: calc(var(--dock-sx) + (100vw - var(--dock-sx) - var(--dock-dx)) / 2); }
  body.con-officina .off-tasto { display: none; }
  #mira { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; z-index: 10; pointer-events: none;
          border: 2px solid rgba(255,255,255,.9); border-radius: 50%; box-shadow: 0 0 0 1px rgba(13,42,26,.5); display: none; }
  body.mira-centro #mira { display: block; }
  #azione { position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%); z-index: 11; pointer-events: none; font: 600 12px/1.2 ui-monospace, monospace;
            color: #fff; background: rgba(13,42,26,.55); padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
  #azione:empty { display: none; }
  /* su uno schermo stretto l'Officina è un foglio dal basso, la tela resta intera */
  /* ⚠ SU UNO SCHERMO STRETTO LE DUE COLONNE NON CI STANNO, e schiacciarle
     sarebbe peggio che non averle: diventano un foglio solo dal basso, con i
     quattro riquadri impilati e scorrevoli. La shell dell'editor è roba da
     scrivania — sul telefono si gioca. */
  @media (max-width: 1100px) {
    body.con-officina { display: block; }
    body.con-officina #tela { width: 100%; }
    body.con-officina #dockSx, body.con-officina #dockDx {
      position: fixed; left: 0; right: 0; width: auto; height: 30vh; z-index: 30; grid-template-rows: 1fr 1fr;
      border-top: 1px solid rgba(223,232,226,.2); }
    body.con-officina #dockSx { bottom: 30vh; }
    body.con-officina #dockDx { bottom: 0; }
    body.con-officina #fps, body.con-officina #azioni { right: 8px; }
    body.con-officina #barra, body.con-officina #mira, body.con-officina #azione { left: 50%; max-width: 96vw; }
    body.con-officina #barra, body.con-officina #azione, body.con-officina #comandi, body.con-officina #modoGui, body.con-officina #diag,
    body.con-officina #fps, body.con-officina #azioni, body.con-officina #versione, body.con-officina #mira { display: none !important; }
  }
  #barra { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 12; display: flex; gap: 4px; max-width: 96vw;
           overflow-x: auto; padding: 4px; background: rgba(255,255,255,.55); border-radius: 8px; scrollbar-width: none; }
  #barra button { flex: 0 0 auto; min-width: 46px; height: 44px; border-radius: 6px; border: 1px solid rgba(13,42,26,.18);
                  background: rgba(255,255,255,.85); font: 600 11px/1.1 ui-monospace, monospace; color: #0d2a1a; padding: 2px 6px; }
  #barra button.scelto { background: #0d2a1a; color: #fff; }
  #barra button { position: relative; }
  #barra button .q { display: block; width: 26px; height: 12px; margin: 0 auto 3px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); }
  /* ⚠ IL NUMERO DELLA CASELLA: con nove caselle fisse ognuna ha davvero il suo
     tasto, e una scorciatoia che non si vede non la usa nessuno. */
  #barra button .n { position: absolute; left: 3px; top: 1px; font-size: 9px; opacity: .45; font-weight: 700; }
  #barra button.scelto .n { opacity: .7; }
  #barra button.vuota { opacity: .45; }
  #barra button.vuota .q { background: none !important; border-style: dashed; }
  /* ⚠ LE PILLOLE «col mouse» e «diagnosi» NON STANNO SUL JOYSTICK: a metà
     schermo (46 %) su un telefono di traverso coprivano la parte alta della
     levetta, e spingendo «avanti» il dito partiva sulla pillola: il gatto non
     camminava («il movimento si blocca in avanti»). A dito vanno in alto a sinistra. */
  html.gui-tocco #diag { top: 58px; }
  html.gui-tocco #modoGui { top: 8px; }
  #azioni { position: fixed; right: 8px; top: 64px; z-index: 12; display: flex; flex-direction: column; gap: 6px; }
  #azioni button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(13,42,26,.18); background: rgba(255,255,255,.8);
                   font-size: 20px; color: #0d2a1a; padding: 0; }
  #azioni button.acceso { background: #0d2a1a; color: #fff; }
  #guasto { position: fixed; inset: 12px; z-index: 100; display: none; font: 13px/1.55 ui-monospace, monospace; color: #fff;
            background: #8b1d1d; padding: 14px; border-radius: 8px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
  <canvas id="tela"></canvas>
  <div id="stato" hidden>avvio…</div>
  <div id="fps">—</div>
  <div id="mira"></div>
  <div id="azione"></div>
  <div id="azioni">
    <button id="cubi" title="Lancia venti cubi (C)">🎲</button>
    <!-- ⚠ LA CREATIVA HA UN TASTO SUO. La hotbar adesso è nove caselle, e tutto
         il resto sta nella creativa dell'Officina: senza una porta diretta, per
         cambiare un blocco bisognerebbe aprire l'Officina e trovare la scheda —
         cioè tre gesti per una cosa che se ne merita uno. -->
    <button id="apriCreativa" title="Creativa: tutti i blocchi e le furniture (E)">🎒</button>
    <button id="apriOfficina" title="Officina (apre e chiude)">🛠</button>
  </div>
  <div id="barra"></div>
  <!-- ⚠ QUATTRO RIQUADRI, come una shell da editor: a sinistra cosa c'è nel
       mondo e cosa si può metterci, a destra cosa si è preso e come è tarata la
       resa. Il gioco sta in mezzo ed è la cosa più grande, perché è quella che
       si guarda mentre si lavora. -->
  <div id="dockSx">
    <div class="riquadro" id="rqGerarchia"></div>
    <div class="riquadro" id="rqAssets"></div>
  </div>
  <div id="dockDx">
    <button id="chiudiDock" title="Chiudi l'Officina">✕</button>
    <div class="riquadro" id="rqIspettore"></div>
    <div class="riquadro" id="rqImpostazioni"></div>
  </div>
  <pre id="guasto"></pre>
  <script type="module">
    const guasto = (e) => {
      const p = document.getElementById('guasto');
      p.style.display = 'block';
      p.textContent += (e && e.stack ? e.stack : String(e)) + '\n';
    };
    window.addEventListener('error', (ev) => guasto(ev.error || ev.message));
    window.addEventListener('unhandledrejection', (ev) => guasto(ev.reason));
    import('./partita.js?v=ec73e94.3ad79712').catch(guasto);
  </script>
  <div id="versione" style="position:fixed;right:8px;bottom:26px;z-index:10;font:11px ui-monospace,monospace;color:rgba(13,42,26,.55);pointer-events:none">10/09, 17:34 · ec73e94</div>
  <script>(function(){try{fetch('./versione.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(v){v=v.trim();if(v&&v!=='ec73e94.3ad79712'&&sessionStorage.getItem('leafy-ricaricata')!==v){sessionStorage.setItem('leafy-ricaricata',v);var u=new URL(location.href);u.searchParams.set('v',v);location.replace(u.href)}}).catch(function(){})}catch(e){}})()</script>
</body>
</html>
