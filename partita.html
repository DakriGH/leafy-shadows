<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Leafy-Shadows · la partita (nucleo)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd0e8; touch-action: none; }
  #tela { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #fps { position: fixed; right: 8px; top: 8px; z-index: 10; font: 600 13px/1.4 ui-monospace, monospace; color: #0d2a1a;
         background: rgba(255,255,255,.72); padding: 5px 9px; border-radius: 6px; pointer-events: none; text-align: right; white-space: pre; }
  #stato { position: fixed; left: 8px; top: 8px; z-index: 10; font: 11px/1.45 ui-monospace, monospace; color: #0d2a1a;
           background: rgba(255,255,255,.72); padding: 6px 9px; border-radius: 6px; white-space: pre-wrap; pointer-events: none; max-width: 62vw; }
  #mira { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; z-index: 10; pointer-events: none;
          border: 2px solid rgba(255,255,255,.9); border-radius: 50%; box-shadow: 0 0 0 1px rgba(13,42,26,.5); }
  #barra { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 12; display: flex; gap: 4px; max-width: 96vw;
           overflow-x: auto; padding: 4px; background: rgba(255,255,255,.55); border-radius: 8px; scrollbar-width: none; }
  #barra button { flex: 0 0 auto; min-width: 46px; height: 44px; border-radius: 6px; border: 1px solid rgba(13,42,26,.18);
                  background: rgba(255,255,255,.85); font: 600 11px/1.1 ui-monospace, monospace; color: #0d2a1a; padding: 2px 6px; }
  #barra button.scelto { background: #0d2a1a; color: #fff; }
  #barra button .q { display: block; width: 26px; height: 12px; margin: 0 auto 3px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); }
  #azioni { position: fixed; right: 8px; top: 64px; z-index: 12; display: flex; flex-direction: column; gap: 6px; }
  #azioni button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(13,42,26,.18); background: rgba(255,255,255,.8);
                   font-size: 20px; color: #0d2a1a; padding: 0; }
  #azioni button.acceso { background: #0d2a1a; color: #fff; }
  #guasto { position: fixed; inset: 12px; z-index: 100; display: none; font: 13px/1.55 ui-monospace, monospace; color: #fff;
            background: #8b1d1d; padding: 14px; border-radius: 8px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
  <canvas id="tela"></canvas>
  <div id="stato">avvio…</div>
  <div id="fps">—</div>
  <div id="mira"></div>
  <div id="azioni">
    <button id="volo" title="Vola (F)">🪶</button>
    <button id="terza" title="Terza persona (V)">🎥</button>
    <button id="cubi" title="Lancia venti cubi (C)">🎲</button>
    <button id="officina" title="Officina">🛠</button>
  </div>
  <div id="barra"></div>
  <pre id="guasto"></pre>
  <script type="module">
    const guasto = (e) => {
      const p = document.getElementById('guasto');
      p.style.display = 'block';
      p.textContent += (e && e.stack ? e.stack : String(e)) + '\n';
    };
    window.addEventListener('error', (ev) => guasto(ev.error || ev.message));
    window.addEventListener('unhandledrejection', (ev) => guasto(ev.reason));
    import('./partita.js?v=0c4d349.3d8f1d8f').catch(guasto);
  </script>
  <div id="versione" style="position:fixed;right:8px;bottom:26px;z-index:10;font:11px ui-monospace,monospace;color:rgba(13,42,26,.55);pointer-events:none">02/09, 18:42 · 0c4d349</div>
</body>
</html>
