<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Leafy-Shadows — banco dell'acqua</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd0e8; touch-action: none;
               font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #0d2a1a; }
  #tela { width: 100%; height: 100%; display: block; outline: none; }

  /* ⚠ LA BARRA STA SOPRA LA SCENA E NON DI FIANCO: questo banco serve a
     confrontare, e ogni pixel tolto all'acqua è pixel tolto alla decisione.
     Sopra costa una striscia; di fianco costerebbe un quarto dello schermo. */
  #barra {
    position: fixed; left: 0; right: 0; top: 0; z-index: 10;
    background: rgba(255,255,255,.82); padding: 6px 10px 7px;
    display: flex; flex-direction: column; gap: 4px;
    border-bottom: 1px solid rgba(13,42,26,.12);
  }
  .riga { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .etichetta { width: 92px; flex: none; opacity: .5; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  button {
    font: inherit; font-size: 12px; color: #0d2a1a; cursor: pointer;
    background: rgba(13,42,26,.06); border: 1px solid rgba(13,42,26,.14);
    border-radius: 5px; padding: 3px 9px;
  }
  button:hover { background: rgba(13,42,26,.12); }
  /* ⚠ L'ACCESO È PIENO, non un bordo: su una barra con venti bottoni un bordo
     più scuro non si trova, e sapere QUALE stile si sta guardando è metà del
     mestiere di questa pagina. */
  button.acceso { background: #0d2a1a; border-color: #0d2a1a; color: #eaf6ef; }

  /* ⚠ IL FONDO È DIVISO IN DUE, non sovrapposto: con la nota larga a piacere il
     contatore ci finiva sopra e i millisecondi si leggevano sulle parole. Su una
     pagina che esiste per guardare, due pannelli che si accavallano sono un
     difetto come un altro. */
  #nota {
    position: fixed; left: 10px; bottom: 10px; right: 220px; z-index: 10; max-width: 46em;
    background: rgba(255,255,255,.82); padding: 8px 11px; border-radius: 7px;
    pointer-events: none;
  }
  #fps {
    position: fixed; right: 10px; bottom: 10px; z-index: 10; white-space: pre; text-align: right;
    background: rgba(255,255,255,.82); padding: 6px 10px; border-radius: 7px;
    font-weight: 600; pointer-events: none;
  }
  #tasti { position: fixed; right: 10px; top: 50%; z-index: 10; opacity: .45; font-size: 11px;
           white-space: pre; text-align: right; pointer-events: none; }
  #guasto {
    position: fixed; inset: 12px; z-index: 100; display: none;
    color: #fff; background: #8b1d1d; padding: 14px; border-radius: 8px;
    overflow: auto; white-space: pre-wrap;
  }
  @media (max-width: 760px) {
    .etichetta { width: 100%; }
    #nota { max-width: 94vw; font-size: 11px; }
    #tasti { display: none; }
  }
</style>
</head>
<body>
  <canvas id="tela"></canvas>
  <div id="barra"></div>
  <div id="nota"></div>
  <div id="fps">—</div>
  <div id="tasti">← → vasca
H stile
↑ ↓ ora
spazio ciclo
S verso il sole
G erba
K qualità</div>
  <pre id="guasto"></pre>
  <script type="module">
    // ⚠ IL BANNER ROSSO PRIMA DI TUTTO. È il canale di diagnosi sul telefono,
    // dove la console non si apre: se il modulo muore durante l'import, senza
    // questo si vede solo uno schermo azzurro e non si sa perché.
    const guasto = (e) => {
      const p = document.getElementById('guasto');
      p.style.display = 'block';
      p.textContent += (p.textContent ? '\n\n' : '') + (e && e.stack ? e.stack : String(e));
    };
    window.addEventListener('error', (ev) => guasto(ev.error || ev.message));
    window.addEventListener('unhandledrejection', (ev) => guasto(ev.reason));
    import('./banco-acqua.js?v=1d29546+.462767a6').catch(guasto);
  </script>
  <div id="versione" style="position:fixed;right:8px;bottom:26px;z-index:10;font:11px ui-monospace,monospace;color:rgba(13,42,26,.55);pointer-events:none">28/08, 23:59 · 1d29546+</div>
</body>
</html>
